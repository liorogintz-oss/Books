<title>שולחן הגישור</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a table seen from above. Side A on the right, side B on the left, the mediator in the middle of every conversation. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --sunk:#e8ecee; --line:#d3dade;
  --fg:#18232b; --muted:#5b6872;
  --side-a:#1f6f8b; --side-a-soft:#dcedf3;
  --side-b:#b35c1e; --side-b-soft:#f6e6d9;
  --med:#4a4f9c; --med-soft:#e6e7f5; --on-med:#ffffff;
  --ok:#2d7a4b; --ok-soft:#dcefe3; --warn:#9a6b00; --warn-soft:#f7edd3; --bad:#a83a3a; --bad-soft:#f5e0e0;
  --display:"Rubik","Assistant",system-ui,sans-serif;
  --body:"Assistant","Rubik",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181c; --surface:#1a2228; --sunk:#141b20; --line:#2c3840;
  --fg:#e3e9ec; --muted:#93a1aa;
  --side-a:#5fb4d1; --side-a-soft:#173039; --side-b:#e39a5f; --side-b-soft:#3a2617;
  --med:#a5a9f0; --med-soft:#252845; --on-med:#141833; --ok:#6cc58f; --ok-soft:#183324; --warn:#e0b44a; --warn-soft:#352a10; --bad:#e58585; --bad-soft:#3a1d1d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181c; --surface:#1a2228; --sunk:#141b20; --line:#2c3840;
  --fg:#e3e9ec; --muted:#93a1aa;
  --side-a:#5fb4d1; --side-a-soft:#173039; --side-b:#e39a5f; --side-b-soft:#3a2617;
  --med:#a5a9f0; --med-soft:#252845; --on-med:#141833; --ok:#6cc58f; --ok-soft:#183324; --warn:#e0b44a; --warn-soft:#352a10; --bad:#e58585; --bad-soft:#3a1d1d;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;direction:rtl}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--med)}
.muted{color:var(--muted)} .small{font-size:.88rem}
.label{font-size:.78rem;letter-spacing:.04em;color:var(--muted);font-weight:700}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
button:hover:not(:disabled){border-color:var(--muted)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--med);border-color:var(--med);color:var(--on-med)}
button.danger{border-color:var(--bad);color:var(--bad)}
button.ghost{background:transparent;border-color:transparent;padding:6px 8px;color:var(--muted)}
button.ghost:hover:not(:disabled){color:var(--fg);border-color:var(--line)}
:focus-visible{outline:2px solid var(--med);outline-offset:2px}
input,textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input[type=checkbox],input[type=radio]{width:auto}
textarea{resize:vertical;min-height:84px}
.field{display:grid;gap:5px}
.field>span{font-weight:700;font-size:.92rem}
.field>em{font-style:normal;font-size:.84rem;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;gap:8px;align-items:flex-start}
.check input{margin-top:5px;flex:none}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.mark{width:40px;height:40px;flex:none}
.brand small{display:block;color:var(--muted);font-size:.85rem;font-family:var(--body)}

.notice{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.notice.bad{background:var(--bad-soft);border-color:var(--bad)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn)}
.notice.ok{background:var(--ok-soft);border-color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
.step{border-top:3px solid var(--line);padding-top:8px}
.step b{display:block;font-family:var(--display);font-size:.95rem}
.step .mono{color:var(--muted)}
.principles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin:0;padding:0;list-style:none}
.principles li{display:grid;gap:1px}
.principles b{font-family:var(--display);font-size:.95rem}
.caselist{display:grid;gap:8px}
.caseitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;text-align:right;align-items:center;padding:12px 14px;width:100%}
.caseitem .t{font-family:var(--display);font-weight:600;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.a{background:var(--side-a-soft);color:var(--side-a)} .pill.b{background:var(--side-b-soft);color:var(--side-b)}
.pill.m{background:var(--med-soft);color:var(--med)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}

/* case */
.casehead{display:grid;gap:12px;margin-bottom:16px}
.stages{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.stages div{border-top:4px solid var(--line);padding-top:5px;font-size:.78rem;font-weight:700;color:var(--muted);line-height:1.3}
.stages div.done{border-color:var(--ok);color:var(--fg)}
.stages div.now{border-color:var(--med);color:var(--med)}
.nextstep{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;background:var(--med-soft);border-radius:var(--r);padding:12px 14px}
.nextstep .k{font-family:var(--display);font-weight:700;color:var(--med)}
.parties{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.party{border-radius:var(--r);padding:10px 14px;border:1px solid var(--line);background:var(--surface);min-width:0}
.party.a{border-inline-start:4px solid var(--side-a)} .party.b{border-inline-start:4px solid var(--side-b)}
.party .who{font-weight:700;overflow-wrap:anywhere}
.vs{align-self:center;font-family:var(--mono);color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:8px 11px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--med)}
.timeline{display:grid;gap:10px}
.msg{display:grid;gap:4px;max-width:86%;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.msg p{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.a{justify-self:start;background:var(--side-a-soft);border-color:transparent}
.msg.b{justify-self:end;background:var(--side-b-soft);border-color:transparent}
.msg.m{justify-self:center;max-width:94%;background:var(--med-soft);border-color:transparent}
.msg .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.msg .meta b{color:var(--fg)}
.msg.a .meta b{color:var(--side-a)} .msg.b .meta b{color:var(--side-b)} .msg.m .meta b{color:var(--med)}
.basis{font-size:.8rem;color:var(--muted)}
.quote{border-inline-start:3px solid var(--line);padding-inline-start:8px;font-size:.85rem;color:var(--muted)}
.composer{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.replying{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--sunk);border-radius:8px;padding:6px 10px;font-size:.88rem}
.tone{display:grid;gap:8px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:12px}
.tone blockquote{margin:0;padding:8px 10px;background:var(--surface);border-radius:8px;white-space:pre-wrap}
.proposal{display:grid;gap:10px}
.proposal ol{margin:0;padding-inline-start:22px;display:grid;gap:4px}
.resp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.resp>div{background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0;overflow-wrap:anywhere}
.side{display:grid;gap:14px}
.actions{display:grid;gap:8px}
.actions button{text-align:right;display:grid;gap:2px;padding:10px 12px}
.actions button small{font-weight:400;color:var(--muted);font-size:.84rem}
.caucus{display:grid;gap:8px;max-height:380px;overflow-y:auto;padding:4px}
.cmsg{padding:8px 11px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}
.cmsg.me{background:var(--sunk);justify-self:start;max-width:90%}
.cmsg.ai{background:var(--med-soft);justify-self:end;max-width:94%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:4px 10px;font-size:.84rem;border-radius:999px;font-weight:600}
.summary dl{display:grid;gap:12px;margin:0}
.summary dt{font-weight:700;font-family:var(--display)}
.summary dd{margin:4px 0 0}
.summary ul{margin:0;padding-inline-start:20px;display:grid;gap:3px}
.agreement{white-space:pre-wrap;background:var(--surface);border:1px solid var(--ok);border-radius:var(--r);padding:18px;line-height:1.7;overflow-wrap:anywhere}
.docs{display:grid;gap:10px}
.doc{display:grid;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.doc.a{border-inline-start:4px solid var(--side-a)} .doc.b{border-inline-start:4px solid var(--side-b)}
.doc .name{font-weight:700;overflow-wrap:anywhere}
.doc ul{margin:0;padding-inline-start:20px;font-size:.92rem}
.doc details summary{cursor:pointer;font-size:.88rem;color:var(--muted)}
.doc pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--body);font-size:.88rem;max-height:260px;overflow:auto;background:var(--sunk);padding:10px;border-radius:8px;margin:6px 0 0}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;text-align:center}
.drop.over{border-color:var(--med);background:var(--med-soft)}
.issues{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.issues li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;background:var(--sunk);border-radius:8px}
.issues li span{overflow-wrap:anywhere}
.issues select{width:auto;padding:4px 8px;font-size:.85rem}
.bidres{font-family:var(--display);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.mono{font-family:var(--mono);font-size:.85rem}
.consent ol{margin:0;padding-inline-start:22px;display:grid;gap:8px}
.consent li b{font-family:var(--display)}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trackbtn{display:grid;gap:4px;text-align:right;padding:14px;border-radius:var(--r);align-content:start}
.trackbtn b{font-family:var(--display);font-size:1.02rem}
.trackbtn svg{width:28px;height:28px}
.trackpick{display:flex;gap:6px;flex-wrap:wrap}
.trackpick button{border-radius:999px;padding:5px 12px;font-size:.88rem}
.trackpick button[aria-pressed="true"]{background:var(--med);border-color:var(--med);color:var(--on-med)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}
.incidents{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.incidents li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;background:var(--sunk);border-radius:8px}
.incidents time{font-family:var(--mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
.incidents span{overflow-wrap:anywhere}
.plan{margin:0;padding-inline-start:22px;display:grid;gap:2px;font-variant-numeric:tabular-nums}
.invite{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:10px;font-size:.92rem;overflow-wrap:anywhere}
.interview{border-color:var(--med);border-width:2px}
.ivq{font-family:var(--display);font-size:1.12rem;font-weight:600;line-height:1.45}
.ivhist{display:grid;gap:8px;margin-top:8px}
.ivhist div{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:.9rem;overflow-wrap:anywhere;white-space:pre-wrap}
.bar{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--med)}
.info{margin:0;padding-inline-start:20px;display:grid;gap:5px;font-size:.92rem}
@media (max-width:900px){
  .home,.grid{grid-template-columns:minmax(0,1fr)}
  .steps,.stages{grid-template-columns:repeat(4,minmax(0,1fr))!important}
}
@media (max-width:560px){
  .parties{grid-template-columns:minmax(0,1fr)} .vs{display:none}
  .msg{max-width:100%} .resp,.two,.principles,.tracks,.checks{grid-template-columns:minmax(0,1fr)}
  .incidents li{grid-template-columns:minmax(0,1fr) auto} .incidents li time{grid-column:1/-1}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#" id="homeLink">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="2" y="2" width="36" height="36" rx="9" fill="var(--sunk)" stroke="var(--line)"/>
        <circle cx="12" cy="20" r="5" fill="var(--side-a)"/>
        <circle cx="28" cy="20" r="5" fill="var(--side-b)"/>
        <path d="M17 20h6" stroke="var(--med)" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span><h1>שולחן הגישור</h1><small>גישור מקוון לפי כללי ADR, בליווי מגשר AI</small></span>
    </a>
    <span id="who" class="small muted"></span>
  </header>
  <main id="app"><div class="notice">טוען את תיקי הגישור…</div></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
"use strict";
const $app = document.getElementById("app");
const S = { db:null, user:null, sample:null, assets:null, downloads:null, uid:null, cases:[], loaded:false, slow:false,
  view:null, caseId:null, c:null, statements:[], proposals:[], docs:[], pdocs:[], bids:{}, incidents:[], caucus:[], priv:{}, iv:{}, ivBusy:false, tab:"table", newTrack:"general", invite:"",
  replyTo:null, busy:"", names:{}, unsub:[], caucusBusy:false, readOnly:false, tone:null, confirm:null, upload:null,
  toneCheck: (()=>{ try { return localStorage.getItem("toneCheck")!=="off"; } catch { return true; } })() };

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==="class") el.className=v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k==="text") el.textContent=v;
    else el.setAttribute(k, v===true?"":v);
  }
  for (const kid of kids.flat()){ if (kid==null||kid===false) continue; el.append(kid.nodeType?kid:document.createTextNode(String(kid))); }
  return el;
}
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,3600); }
const fmt = ms => { try { return new Date(ms).toLocaleString("he-IL",{day:"numeric",month:"numeric",year:"2-digit",hour:"2-digit",minute:"2-digit"}); } catch { return ""; } };
const money = n => { try { return new Intl.NumberFormat("he-IL",{style:"currency",currency:"ILS",maximumFractionDigits:0}).format(n); } catch { return n+" ₪"; } };
const sideName = s => s==="a" ? "צד א׳" : s==="b" ? "צד ב׳" : "המגשר";
const other = s => s==="a" ? "b" : "a";
const val = id => (document.getElementById(id)?.value||"").trim();
const arr = (x,n=10) => Array.isArray(x) ? x.map(String).filter(Boolean).slice(0,n) : [];
function partyLabel(c, s){
  if (!c) return sideName(s);
  const uid = c.parties?.[s]; const nm = uid && S.names[uid];
  return [nm || sideName(s), c.labels?.[s]].filter(Boolean).join(" · ");
}
function mySide(c){ if (!c||!S.uid) return null; if (c.parties?.a===S.uid) return "a"; if (c.parties?.b===S.uid) return "b"; return null; }
const isOpen = c => c && (!c.status || c.status==="open");
async function resolveNames(ids){
  ids = [...new Set(ids.filter(Boolean))].filter(id=>!(id in S.names));
  if (!ids.length || !S.user) return;
  try { const ps = await S.user.profiles(ids); for (const id of ids) S.names[id] = ps[id]?.name || ""; render(); } catch {}
}
function sampleErr(e){
  const c = e && e.code;
  if (c==="not_granted") return "לא ניתנה הרשאה למגשר ה-AI. אפשר לאשר אותה מתפריט ההרשאות של הדף.";
  if (c==="rate_limited") return "המגשר עמוס כרגע. נסו שוב בעוד דקה.";
  if (c==="invalid_json") return "התשובה של המגשר לא הגיעה בפורמט המצופה. נסו שוב.";
  if (c==="refused") return "המגשר סירב לבקשה הזו. נסחו אותה אחרת.";
  if (c==="prompt_too_large") return "התיק ארוך מדי לבקשה אחת. נסו להסיר מסמכים ארוכים.";
  return "המגשר לא הצליח לענות ("+(c||"שגיאה")+"). נסו שוב.";
}

/* ---------- ADR process model ---------- */
const STAGE_DEFS = {
  consent:{k:"הסכמה להליך", d:"שני הצדדים מצטרפים ומאשרים את כללי ההליך", done:c=>!!(c.parties?.b&&c.consents?.a&&c.consents?.b)},
  opening:{k:"דברי פתיחה", d:"כל צד מציג את הסיפור שלו ומעלה מסמכים", done:c=>!!(c.openings?.a&&c.openings?.b)},
  agenda:{k:"סדר יום", d:"הגדרת הסוגיות שצריך להכריע בהן", done:c=>!!c.issues?.length},
  interests:{k:"בירור אינטרסים", d:"שאלות המגשר וסיכום הצרכים של כל צד", done:c=>!!c.summary},
  options:{k:"יצירת אפשרויות", d:"הצעות של המגשר ושל הצדדים", done:c=>!!c.proposalCount},
  negotiation:{k:"משא ומתן", d:"תגובות, שיפורים, הצעה סגורה ופריסת תשלומים", done:c=>!!c.agreedProposal},
  agreement:{k:"הסכם", d:"טיוטת הסכם גישור", done:c=>!!c.agreementText},
  signing:{k:"חתימה וסיום", d:"אישור שני הצדדים וסגירת התיק", done:c=>!!(c.signatures?.a&&c.signatures?.b)},
};
const FLOWS = {
  full:[["consent"],["opening"],["agenda"],["interests"],["options"],["negotiation"],["agreement"],["signing"]],

}

כתוב בעברית פשוטה, מכבדת וקונקרטית, בלי מליצות.`;
const respName = s => ({accept:"מסכים", change:"מסכים בתנאי שינוי", reject:"לא מסכים"})[s] || s;

function docsContext(list, budget){
  if (!list.length) return "(לא הועלו מסמכים)";
  const per = Math.max(1500, Math.floor(budget / list.length));
  return list.map(d => {
    const head = `מסמך "${d.name}" (הועלה על ידי ${sideName(d.side)}${d.private?", חסוי":""})`;
    const sum = d.summary ? `תקציר: ${d.summary}` : "";
    const facts = d.keyFacts?.length ? `עובדות מרכזיות: ${d.keyFacts.join("; ")}` : "";
    const body = d.text ? `קטע מהטקסט:\n${d.text.slice(0, per)}${d.text.length>per?"\n…":""}` : "";
    return [head, sum, facts, body].filter(Boolean).join("\n");
  }).join("\n\n");
}
function caseContext(c, opts={}){

  if (c.summary) lines.push("סיכום ביניים קודם: "+JSON.stringify({a:c.summary.a_interests,b:c.summary.b_interests,common:c.summary.common,gaps:c.summary.gaps}));

    const kind = s.kind==="question" ? ` [שאלה ל${sideName(s.target)}]` : s.kind==="opening" ? " [דברי פתיחה]" : s.kind==="shared" ? " [שותף באישורו מתוך השיחה הפרטית עם המגשר]" : "";
    const rep = s.replyTo ? ` [בתשובה ל: "${(S.statements.find(x=>x.id===s.replyTo)?.text||"").slice(0,120)}"]` : "";
    return `${who}${kind}${rep}: ${s.text}`;
  }).join("\n");
  if (t.length > 16000) t = "…\n" + t.slice(-16000);
  lines.push("\nהשיחה בשולחן המשותף:\n" + (t || "(עדיין אין הודעות)"));
  if (S.proposals.length){
    lines.push("\nהצעות שהוצעו ותגובות הצדדים:");
    for (const p of S.proposals){

      for (const s of ["a","b"]){ const r=p.responses?.[s]; if (r) lines.push(`   ${sideName(s)}: ${respName(r.status)}${r.note?` – "${r.note}"`:""}`); }
    }
  }
  const mr = c.money?.results; if (mr && Object.keys(mr).length) lines.push("תוצאות סבבי הצעה סגורה: " + Object.entries(mr).map(([r,x])=>`סבב ${r}: ${x.overlap?"נמצאה חפיפה, סכום "+money(x.settle):"אין חפיפה"}`).join("; "));
  return lines.join("\n");
}

  const slowT = setTimeout(()=>{ S.slow=true; render(); }, 10000);
  const [db, user, sample, assets, downloads] = await Promise.all(["db","user","sample","assets","downloads"].map(n=>window.claude?.use ? window.claude.use(n).catch(()=>null) : Promise.resolve(null)));
  Object.assign(S, {db, user, sample, assets, downloads});
  if (user){ try { S.uid = await user.id(); } catch {} try { if (await user.can("data.write")===false) S.readOnly=true; } catch {} }
  if (S.uid) resolveNames([S.uid]).then(()=>{ const n=S.names[S.uid]; document.getElementById("who").textContent = n ? "מחובר/ת: "+n : ""; });
  if (!db){ clearTimeout(slowT); S.loaded=true; render(); return; }
  db.collection("cases").orderBy("createdAt","desc").limit(300).onSnapshot(snap => {
    S.cases = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if (!snap.metadata.fromCache){ clearTimeout(slowT); S.slow=false; }
    S.loaded=true;
    resolveNames(S.cases.flatMap(c=>[c.parties?.a,c.parties?.b]));
    render();
  }, e => { clearTimeout(slowT); S.loaded=true; S.err="לא ניתן לטעון את התיקים ("+e.code+")."; render(); });
  route();
}

function route(){
  const m = location.hash.match(/^#case-([A-Za-z0-9_-]+)$/);
  const id = m ? m[1] : null;
  if (id === S.caseId && S.view) { render(); return; }
  S.unsub.forEach(u=>{try{u()}catch{}}); S.unsub=[];
  Object.assign(S, {statements:[], proposals:[], docs:[], pdocs:[], bids:{}, incidents:[], caucus:[], priv:{}, iv:{}, replyTo:null, tab:"table", tone:null, confirm:null, invite:""});
  if (!id){ S.view="home"; S.caseId=null; S.c=null; render(); window.scrollTo(0,0); return; }
  S.view="case"; S.caseId=id; S.c = S.cases.find(c=>c.id===id) || null;
  if (S.db){
    const base = S.db.doc("cases/"+id);
    const sub = (q, fn) => S.unsub.push(q.onSnapshot(fn, ()=>{}));
    sub(base, d => { S.c = d.exists ? {id:d.id, ...d.data()} : null; S.caseMissing = !d.exists && !d.metadata.fromCache; render(); });
    sub(base.collection("statements").orderBy("createdAt").limit(1000), s => { S.statements = s.docs.map(d=>({id:d.id, ...d.data()})); resolveNames(S.statements.map(x=>x.uid)); render(); });
    sub(base.collection("proposals").orderBy("createdAt").limit(200), s => { S.proposals = s.docs.map(d=>({id:d.id, ...d.data()})); render(); });
    sub(base.collection("docs").orderBy("createdAt").limit(100), s => { S.docs = s.docs.map(d=>({id:d.id, ...d.data()})); render(); });
    sub(base.collection("incidents").orderBy("when").limit(500), s => { S.incidents = s.docs.map(d=>({id:d.id, ...d.data()})); render(); });
    sub(base.collection("bids"), s => { S.bids = {}; s.docs.forEach(d=>S.bids[d.id]=d.data()); render(); });
    if (S.uid){
      const mine = S.db.collection("data/users/"+S.uid);
      sub(mine.doc("caucus-"+id), d => { S.caucus = d.exists ? (d.data().messages||[]) : []; render(); });
      sub(mine.doc("interview-"+id), d => { if (!S.ivSaving) S.iv = d.exists ? d.data() : {}; render(); });
      sub(mine.doc("private-"+id), d => { S.priv = d.exists ? d.data() : {}; render(); });
      sub(mine.where("caseId","==",id), s => { S.pdocs = s.docs.map(d=>({id:d.id, ...d.data()})).filter(d=>d.kind==="doc").sort((a,b)=>a.createdAt-b.createdAt); render(); });
    }
  }
  render(); window.scrollTo(0,0);
}

      const cv = document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height;
      await p.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;

}

async function uploadDoc(file){

  if (file.size > 15*1024*1024){ toast("הקובץ גדול מ-15MB"); return; }
  const progress = t => { S.upload = t; render(); };
  try {
    progress("מחלץ טקסט מהמסמך…");
    const ex = await extractText(file, progress);
    let text = (ex.text||"").replace(/\u0000/g,"").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
    let summary="", keyFacts=[], ocr=false;
    if (S.sample){

      const ask = `קרא מסמך שהועלה לתיק גישור בנושא "${c.title}" על ידי ${sideName(me)}. ${ex.images?"המסמך מצורף כתמונה. תמלל את כל הטקסט שבו בשדה text.":""}\nכתוב תקציר ניטרלי של 2-3 משפטים ועד 8 עובדות מרכזיות (תאריכים, סכומים, התחייבויות, סעיפים). אל תפרש מי צודק.\n${text?`הטקסט:\n"""${text.slice(0,30000)}"""`:""}\nהחזר JSON בלבד: {${ex.images?'"text":"התמלול המלא",':''}"summary":"...","key_facts":["..."]}`;
      try {
        const r = await S.sample.json(ask, {modelTier:"default", ...(ex.images?{images:ex.images}:{})});
        summary = String(r.summary||""); keyFacts = arr(r.key_facts, 8);
        if (ex.images && r.text){ text = String(r.text); ocr = true; }
      } catch(e){ if (ex.images) throw e; }
    } else if (ex.images) throw {code:"needs_ai"};
    if (!text && !summary) throw {code:"empty"};
    const rec = {caseId:S.caseId, kind:"doc", name:file.name.slice(0,140), side:me, uid:S.uid, type:file.type||ext(file.name), size:file.size, pages:ex.pages||null, ocr, text:text.slice(0,45000), summary, keyFacts, createdAt:Date.now()};
    if (isPriv){

      await S.db.collection(`cases/${S.caseId}/docs`).add(rec);
      await S.db.collection(`cases/${S.caseId}/statements`).add({side:me, uid:S.uid, kind:"message", text:`העליתי מסמך: ${rec.name}${summary?`\n${summary}`:""}`, createdAt:Date.now()});
    }
    toast(isPriv?"המסמך החסוי נשמר":"המסמך נוסף לתיק");
  } catch(e){
    const m = {unsupported:"סוג הקובץ לא נתמך. העלו PDF, docx, טקסט או תמונה.", empty:"לא נמצא טקסט במסמך.", needs_ai:"כדי לקרוא תמונה או PDF סרוק צריך את המגשר ה-AI, והוא לא זמין בתצוגה הזו."}[e?.code];
    toast(m || (e?.code ? sampleErr(e) : "העלאת המסמך נכשלה. נסו שוב."));
  }
  S.upload=null; render();
}

/* ---------- private interview with the mediator ---------- */
function renderInterview(c, me){
  if (!me || !isOpen(c) || !c.consents?.[me]) return null;
  const iv = S.iv || {}, qa = iv.qa || [], n = qa.length;
  const issues = (c.issues||[]).filter(i=>i.status!=="dropped");
  const mine = issues.filter(i=>i.cl?.[me] || i.status==="agreed").length;
  const otherDone = c.interview?.[other(me)]?.done;
  const card = h("section",{class:"card stack interview"},
    h("div",{class:"row between"}, h("h3",{text:"המגשר שואל אותך"}), h("span",{class:"pill "+me},"חסוי · רק את/ה והמגשר")));
  if (issues.length) card.append(h("div",{class:"stack",style:"gap:4px"},
    h("span",{class:"small muted",text:`המגשר בירר איתך ${mine} מתוך ${issues.length} נושאים`}),
    h("div",{class:"bar"},h("span",{style:`width:${Math.round(100*mine/issues.length)}%`}))));
  if (!S.sample){ card.append(h("div",{class:"notice small",text:"המגשר ה-AI לא זמין בתצוגה הזו. פתחו את הדף ב-claude.ai כשאתם מחוברים."})); return card; }
  if (S.ivBusy){ card.append(h("p",{},h("span",{class:"spin"})," המגשר חושב…")); }
  else if (iv.share){
    card.append(h("div",{class:"stack",style:"gap:8px"},
      h("b",{text:"המגשר מציע להעביר לשולחן המשותף:"}),
      h("p",{class:"small muted",text:"התשובה שלך עצמה נשארת חסויה. רק הנוסח הזה יעבור, ורק אם תאשר/י. אפשר לערוך אותו."}),
      h("textarea",{id:"ivShare-"+n,maxlength:"800",style:"min-height:70px"}, iv.share),
      h("div",{class:"row"},
        h("button",{class:"primary",onclick:()=>ivShare(true)},"לשתף"),
        h("button",{onclick:()=>ivShare(false)},"לא לשתף"))));
  }
  else if (iv.pending){
    card.append(h("div",{class:"stack",style:"gap:8px"},
      h("p",{class:"ivq",text:iv.pending.q}),
      iv.pending.basis ? h("span",{class:"basis",text:"מבוסס על: "+iv.pending.basis}) : null,
      h("textarea",{id:"ivAns-"+n,maxlength:"3000",placeholder:"התשובה שלך. היא נשארת בינך לבין המגשר."}),
      h("div",{class:"row between"},
        h("button",{class:"ghost small",onclick:()=>ivStep("(הצד בחר לא לענות על השאלה הזו)")},"מעדיף/ה לא לענות"),
        h("button",{class:"primary",onclick:()=>{ const a=val("ivAns-"+n); if (!a){ toast("כתבו תשובה, או בחרו לא לענות"); return; } ivStep(a); }},"שליחה למגשר"))));
  }
  else if (iv.done){
    card.append(h("p",{text: otherDone ? (c.proposalCount ? "שני הצדדים סיימו את השיחות עם המגשר. ההצעות מחכות לך בלשונית ״הצעות״." : "שני הצדדים סיימו. המגשר מכין סיכום והצעות להסדר.") : "סיימת את השיחה עם המגשר. כשגם הצד השני יסיים, המגשר יסכם ויציע הסדרים."}),
      h("div",{},h("button",{class:"ghost small",onclick:()=>ivStep(null, true)},"יש לי עוד משהו לספר למגשר")));
  }
  else if (!n){
    card.append(h("p",{text:"המגשר ישאל אותך כמה שאלות, אחת בכל פעם, כדי להבין מה חשוב לך ומה יכול לעבוד בשבילך. התשובות נשארות ביניכם. אחרי כל תשובה הוא יציע מה להעביר לצד השני, ושום דבר לא עובר בלי אישורך."}),
      !c.openings?.[me] ? h("p",{class:"small muted",text:"כדאי לכתוב קודם דברי פתיחה בשולחן המשותף, כדי שהמגשר יכיר את הצד שלך."}) : null,
      h("div",{},h("button",{class:"primary",onclick:()=>ivStep(null)},"להתחיל את השיחה עם המגשר")));
  }
  else card.append(h("div",{},h("button",{class:"primary",onclick:()=>ivStep(null)},"לשאלה הבאה")));
  if (n) card.append(h("details",{}, h("summary",{class:"small",style:"cursor:pointer",text:`השאלות והתשובות שלך (${n})`}),
    h("div",{class:"ivhist"}, qa.map(x=>h("div",{}, h("b",{text:x.q}), "\n", x.a)))));
  return card;
}
async function saveIv(patch){
  const next = {...(S.iv||{}), ...patch, at:Date.now()};
  S.iv = next; S.ivSaving = true; render();
  try { await S.db.doc(`data/users/${S.uid}/interview-${S.caseId}`).set(next); } finally { S.ivSaving = false; }
}
function ivPrompt(c, me, task){
  const qa = (S.iv?.qa||[]).map((x,i)=>`ש${i+1}: ${x.q}\nת${i+1}: ${x.a}`).join("\n\n") || "(עדיין אין)";
  return `${MEDIATOR}\n\n${caseContext(c,{docBudget:12000})}\n\nזו שיחה פרטית (קוקוס) בינך לבין ${sideName(me)}${c.labels?.[me]?` (${c.labels[me]})`:""} בלבד. התשובות חסויות: שום דבר לא עובר לצד השני בלי אישור מפורש של ${sideName(me)}.${S.priv.safetyConcern?"\nהצד הזה דיווח על חשש לבטיחות או לפער כוחות. שאל בעדינות, ואל תלחץ.":""}\n\nמסמכים חסויים של הצד הזה:\n${docsContext(S.pdocs.map(d=>({...d,private:true})), 8000)}\n\nהשיחה הפרטית עד עכשיו:\n${qa}\n\n${task}`;
}
async function ivStep(answer, reopen){
  const c = S.c, me = mySide(c);
  if (S.ivBusy) return;
  S.ivBusy = true; render();
  try {
    const qa = [...(S.iv?.qa||[])];
    if (answer!=null && S.iv?.pending){ qa.push({q:S.iv.pending.q, basis:S.iv.pending.basis||"", a:answer, at:Date.now()}); await saveIv({qa, pending:null}); }
    const needIssues = !(c.issues||[]).length;
    const list = (c.issues||[]).map((i,k)=>`${k+1}. ${i.text}${i.cl?.[me]?" [בורר עם הצד הזה]":""}`).join("\n");
    const task = `משימה: אתה מנהל ראיון בירור עם הצד הזה, שאלה אחת בכל פעם.
${needIssues ? "עדיין אין רשימת נושאים לגישור. קבע 3 עד 7 נושאים שצריך לברר ולהסכים עליהם, מנוסחים בניטרליות, בשדה issues." : "הנושאים שאתה מברר:\n"+list}
${answer!=null ? `התשובה האחרונה של הצד: """${answer}"""` : reopen ? "הצד ביקש להוסיף משהו. שאל מה הוא רוצה להוסיף." : "זו תחילת השיחה. פתח בשאלה רחבה ומזמינה."}
1. אם הייתה תשובה: כתוב בשדה share משפט או שניים, ניטרליים ובגוף שלישי ("${c.labels?.[me]||sideName(me)} מציין/ת ש..."), עם מה שיעזור לצד השני להבין את האינטרסים והצרכים של הצד הזה ולהתקדם להסכם. בלי מידע רגיש, מביך או טקטי (למשל הסכום המקסימלי שהוא מוכן לשלם). אם אין מה לשתף, השאר ריק.
2. בשדה clarified ציין את מספרי הנושאים שבהם הבנת כבר את האינטרסים, החששות והגמישות של הצד הזה.
3. אם עדיין חסר מידע חשוב, שאל את השאלה הבאה: פתוחה, קצרה, לא מאשימה. התבסס על מה שנאמר, על המסמכים ועל מה שהצד השני שיתף. אל תחזור על שאלות. ציין בשדה basis על מה השאלה מבוססת, אם יש.
4. כשיש לך תמונה מספיקה בכל הנושאים (בדרך כלל אחרי 4 עד 8 שאלות), החזר done true ו-question ריק.
החזר JSON בלבד: {${needIssues?'"issues":["..."],':''}"share":"","clarified":[1],"question":"","basis":"","done":false}`;
    const r = await S.sample.json(ivPrompt(c, me, task), {modelTier:"default"});
    const ref = S.db.doc("cases/"+S.caseId);
    const fresh = (await ref.get()).data() || {};
    let issues = fresh.issues || [];
    if (!issues.length && Array.isArray(r.issues)) issues = arr(r.issues,7).map((t,i)=>({id:(Date.now()+i).toString(36), text:t, status:"open", by:"m"}));
    const cl = Array.isArray(r.clarified) ? r.clarified.map(Number) : [];
    issues = issues.map((i,k)=>cl.includes(k+1) && !i.cl?.[me] ? {...i, cl:{...(i.cl||{}), [me]:true}, status: i.status==="open" && (i.cl?.[other(me)]) ? "clarified" : i.status} : i);
    const done = !!r.done || qa.length >= 10 || !r.question;
    const next = done ? null : {q:String(r.question), basis:String(r.basis||"")};
    await ref.update({issues, interview:{[me]:{answered:qa.length, done}}});
    await saveIv({qa, pending:next, done, share: answer!=null ? String(r.share||"").trim() : ""});
    if (done && fresh.interview?.[other(me)]?.done && !fresh.proposalCount && !fresh.autoProposed){
      await ref.update({autoProposed:true});
      S.ivBusy = false;
      await withLock("prop", async () => { await summaryCore(); await proposeCore(); });
    }
  } catch(e){ toast(e?.code ? sampleErr(e) : "המגשר לא הצליח להמשיך. נסו שוב."); }
  S.ivBusy = false; render();
}
async function ivShare(ok){
  const me = mySide(S.c), n = (S.iv?.qa||[]).length;
  const text = ok ? val("ivShare-"+n) : "";
  try {
    if (text) await S.db.collection(`cases/${S.caseId}/statements`).add({side:me, uid:S.uid, kind:"shared", text, createdAt:Date.now()});
    await saveIv({share:""});
    if (text) toast("הועבר לשולחן המשותף");
  } catch { toast("השמירה נכשלה"); }
}

/* ---------- private caucus ---------- */
function renderCaucus(c, me){
  if (!me) return null;
  const log = h("div",{class:"caucus",id:"caucusLog"});
  if (S.priv.safetyConcern) log.append(h("div",{class:"notice warn small",text:"ציינת חשש לבטיחות. אם יש סכנה מיידית: משטרה 100. קו חם לאלימות במשפחה: 118."}));
  if (!S.caucus.length) log.append(h("p",{class:"small muted",text:"כאן מדברים עם המגשר ביחידות: לפרוק, לבדוק מה החלופות שלך, להבין מה הצד השני צריך, או לבקש עזרה בניסוח. הצד השני לא רואה את זה, וגם לא בעלי הדף."}));
  for (const m of S.caucus) log.append(h("div",{class:"cmsg "+(m.role==="user"?"me":"ai"),text:m.content}));

  const quick = [
    ["בדיקת חלופות","עזור לי לבדוק את החלופות שלי: מה יקרה אם לא נגיע להסכם (BATNA), מה התרחיש הגרוע (WATNA), וכמה זה יעלה לי בזמן ובכסף."],
    ["מה הצד השני צריך?","מה לדעתך הצד השני באמת צריך, מתחת לעמדות שלו? איך אוכל לענות על זה בלי לוותר על מה שחשוב לי?"],
    ["האם ההצעה טובה לי?","תעזור לי להעריך את ההצעה האחרונה ביחס לאינטרסים שלי ולחלופות שלי."],
    ["מה במסמכים שלי?","מה במסמכים שהעליתי, כולל החסויים, יכול לחזק או להחליש את המצב שלי? אילו מסמכים חסרים?"]];
  return h("div",{class:"card stack"},
    h("div",{class:"row between"}, h("h3",{text:"שיחה חופשית עם המגשר"}), h("span",{class:"pill "+me},"רק את/ה")),
    log,
    S.sample && c.consents?.[me] ? h("div",{class:"stack",style:"gap:8px"},
      h("div",{class:"chips"}, quick.map(([l,q])=>h("button",{type:"button",disabled:S.caucusBusy,onclick:()=>caucusSend(null,q)},l))),
      h("form",{class:"stack",style:"gap:8px",onsubmit:caucusSend},
        h("textarea",{id:"caucusIn",maxlength:"3000",style:"min-height:64px",placeholder:"מה עובר עליך? מה היית רוצה להשיג?"}),
        h("div",{class:"row between"},
          h("button",{type:"button",class:"ghost small",onclick:caucusDraft,disabled:S.caucusBusy||!S.caucus.length},"נסח לי הודעה לשולחן המשותף"),
          h("button",{class:"primary",type:"submit",disabled:S.caucusBusy}, S.caucusBusy?h("span",{class:"spin"}):"שליחה")))) : null);
}
function caucusPrompt(){
  const me = mySide(S.c);
  return `${MEDIATOR}\n\nזו פגישה פרטית (קוקוס) שלך עם ${sideName(me)}${S.c.labels?.[me]?` (${S.c.labels[me]})`:""} בלבד. מה שנאמר כאן חסוי ולא יגיע לצד השני. שמור על ניטרליות: עזור לצד הזה להבין את האינטרסים שלו, לבחון את החלופות שלו (BATNA/WATNA), לראות את נקודת המבט של הצד השני, ולנסח את עצמו בצורה שמקדמת הסכמה. אל תסית נגד הצד השני ואל תבטיח תוצאה. ענה בקצרה (עד 140 מילים) אלא אם התבקשת אחרת.${S.priv.safetyConcern?"\nשים לב: הצד הזה דיווח על חשש לבטיחות או לפער כוחות. בדוק בעדינות שהוא בטוח, הזכר את האפשרות לפנות לגורם מקצועי, ואל תלחץ להסכם.":""}\n\nמצב התיק:\n${caseContext(S.c,{docBudget:14000})}\n\nמסמכים חסויים של הצד הזה (רק הוא והמגשר רואים):\n${docsContext(S.pdocs.map(d=>({...d,private:true})), 12000)}`;
}
async function saveCaucus(msgs){ await S.db.doc(`data/users/${S.uid}/caucus-${S.caseId}`).set({messages:msgs.slice(-60), at:Date.now()}); }
async function caucusSend(ev, preset){
  ev?.preventDefault();
  const text = preset || val("caucusIn"); if (!text || S.caucusBusy) return;
  if (!preset) setVal("caucusIn","");
  S.caucusBusy=true;
  const msgs = [...S.caucus, {role:"user", content:text}]; S.caucus = msgs; S.caucusStream="…"; render();
  try {
    const r = await S.sample([{role:"user", content:caucusPrompt()}, ...msgs.slice(-20)], {cache:false, onText:({text})=>{ S.caucusStream=text||"…"; render(); }});
    S.caucusStream=""; await saveCaucus([...msgs, {role:"assistant", content:r.text}]);
  } catch(e){ S.caucusStream=""; toast(sampleErr(e)); try{ await saveCaucus(msgs); }catch{} }
  S.caucusBusy=false; render();
}
async function caucusDraft(){
  if (S.caucusBusy) return; S.caucusBusy=true; render();
  try {
    const r = await S.sample([{role:"user", content:caucusPrompt()}, ...S.caucus.slice(-20), {role:"user", content:"על בסיס השיחה שלנו, נסח בשבילי הודעה קצרה (עד 100 מילים), מכבדת וענייניות, לשולחן המשותף. בגוף ראשון ובשמי. אל תחשוף שום דבר מהמסמכים החסויים או מהשיחה הפרטית שלא ביקשתי במפורש לשתף. החזר רק את נוסח ההודעה."}], {cache:false});
    S.tab="table"; S.caucusBusy=false; render();
    setVal("say", r.text.trim()); document.getElementById("say")?.focus();
    toast("הטיוטה בתיבת ההודעה. ערכו לפני שליחה.");
  } catch(e){ toast(sampleErr(e)); }
  S.caucusBusy=false; render();
}

    if (me) box.append(renderFeedback(c, me));
  } else if (me){
    if (S.confirm==="close") box.append(h("div",{class:"stack",style:"gap:8px"},
      h("label",{class:"field"},h("span",{text:"סיבה"}),h("select",{id:"closeReason"}, h("option",{value:"impasse",text:"מבוי סתום: לא מצליחים להתקדם"}), h("option",{value:"withdraw",text:"אני יוצא/ת מההליך"}), h("option",{value:"other",text:"אחר"}))),
      h("p",{class:"small",text:"סיום ההליך סוגר את התיק לשני הצדדים. אי אפשר לבטל את זה."}),
      h("div",{class:"row"}, h("button",{class:"danger",onclick:closeCase},"סיום ההליך"), h("button",{class:"ghost",onclick:()=>{S.confirm=null;render();}},"ביטול"))));
    else box.append(h("p",{class:"small muted",text:"כל צד רשאי לצאת מההליך בכל שלב, בלי לנמק."}), h("div",{},h("button",{class:"danger",onclick:()=>{S.confirm="close";render();}},"סיום ההליך בלי הסכם")));
  }
  box.append(h("div",{class:"row"},
    S.downloads ? h("button",{onclick:()=>save(`דוח-תיק-${c.id.slice(0,8)}.md`, caseReport(c))},"הורדת דוח התיק") : null,
    h("button",{class:"ghost",onclick:()=>{ navigator.clipboard.writeText(caseReport(c)).then(()=>toast("הדוח הועתק")).catch(()=>toast("ההעתקה לא הצליחה")); }},"העתקת הדוח")));
  box.append(h("p",{class:"small muted",text:"הדוח כולל את השולחן המשותף, המסמכים המשותפים, סדר היום, הסיכום, ההצעות וההסכם. החדר הפרטי לא נכלל."}));
  return box;
}
async function closeCase(){
  const reason = val("closeReason")||"other";
  try { await S.db.doc("cases/"+S.caseId).update({status:"withdrawn", closure:{by:mySide(S.c), reason, at:Date.now()}, closedAt:Date.now()}); S.confirm=null; toast("ההליך הסתיים"); } catch { toast("הפעולה נכשלה"); }
}
function renderFeedback(c, me){
  const f = c.feedback?.[me];
  if (f) return h("p",{class:"small muted",text:`תודה על המשוב (${f.score}/5).`});
  return h("form",{class:"stack",style:"gap:8px",onsubmit:async e=>{ e.preventDefault(); const score=Number(val("fbScore")); try { await S.db.doc("cases/"+S.caseId).update({feedback:{[me]:{score, text:val("fbText"), at:Date.now()}}}); toast("תודה!"); } catch { toast("השמירה נכשלה"); } }},
    h("label",{class:"field"},h("span",{text:"עד כמה ההליך היה הוגן בעיניך?"}),h("select",{id:"fbScore"}, [5,4,3,2,1].map(n=>h("option",{value:String(n),text:n+" "+["","גרוע","חלש","סביר","טוב","מצוין"][n]})))),
    h("textarea",{id:"fbText",maxlength:"1000",style:"min-height:56px",placeholder:"מה עבד ומה לא? (לא חובה)"}),
    h("button",{type:"submit"},"שליחת משוב"));
}
function caseReport(c){
  const L = [];
  L.push(`# דוח תיק גישור: ${c.title}`, "");
  L.push(`- קוד תיק: ${c.id}`, `- תחום: ${c.topic||"—"}`, `- נפתח: ${fmt(c.createdAt)}`, `- צד א׳: ${partyLabel(c,"a")}`, `- צד ב׳: ${c.parties?.b?partyLabel(c,"b"):"לא הצטרף"}`, `- מסלול: ${TRACKS[c.track||"general"].label}`, `- שלב: ${stagesFor(c)[stageOf(c)].k}`, `- סטטוס: ${({open:"פתוח",settled:"הסתיים בהסכם",withdrawn:"הסתיים בלי הסכם"})[c.status||"open"]}`);
  if (c.amount) L.push(`- סכום שנוי במחלוקת: ${money(c.amount)}`);
  for (const s of ["a","b"]) if (c.consents?.[s]) L.push(`- ${sideName(s)} אישר/ה את כללי ההליך: ${fmt(c.consents[s].at)}`);
  L.push("", "## תיאור הסכסוך", c.description||"");
  if (S.incidents.length){ L.push("", "## יומן אירועים"); S.incidents.forEach(x=>L.push(`- ${x.when.replace("T"," ")} · ${sideName(x.side)}: ${x.what}`)); }
  if (c.issues?.length){ L.push("", "## סדר יום"); c.issues.forEach((i,n)=>L.push(`${n+1}. ${i.text} (${issueStatus[i.status]||"פתוח"})`)); }
  if (c.summary){ const s=c.summary; L.push("", "## סיכום המגשר", s.overview, "", "### "+partyLabel(c,"a"), ...(s.a_interests||[]).map(x=>"- "+x), "", "### "+partyLabel(c,"b"), ...(s.b_interests||[]).map(x=>"- "+x), "", "### נקודות הסכמה", ...(s.common||[]).map(x=>"- "+x), "", "### פערים", ...(s.gaps||[]).map(x=>"- "+x)); }
  if (S.docs.length){ L.push("", "## מסמכים משותפים"); S.docs.forEach(d=>L.push(`- ${d.name} (${sideName(d.side)}): ${d.summary||""}`)); }
  L.push("", "## השולחן המשותף");
  for (const s of S.statements) L.push(`**${s.side==="m"?"המגשר":partyLabel(c,s.side)}** · ${fmt(s.createdAt)}${s.kind==="question"?` · שאלה ל${sideName(s.target)}`:""}`, s.text, "");
  if (S.proposals.length){ L.push("## הצעות להסדר"); for (const p of S.proposals){ L.push(`### #${p.n} ${p.title}`, ...(p.terms||[]).map(t=>"- "+t)); for (const s of ["a","b"]){ const r=p.responses?.[s]; L.push(`- תגובת ${sideName(s)}: ${r?respName(r.status)+(r.note?` (${r.note})`:""):"אין"}`); } L.push(""); } }
  if (c.agreementText){ L.push("## טיוטת הסכם", c.agreementText, ""); for (const s of ["a","b"]) if (c.signatures?.[s]) L.push(`אושר על ידי ${c.signatures[s].name} (${sideName(s)}) · ${fmt(c.signatures[s].at)}`); }
  L.push("", "---", "הדוח הופק בשולחן הגישור. המגשר בהליך הוא מערכת AI ואינו נותן ייעוץ משפטי.");
  return L.join("\n");
}

document.getElementById("homeLink").addEventListener("click", e=>{ e.preventDefault(); location.hash=""; if (S.view!=="home") route(); });
boot();
})();
</script>
